services:
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-triage-api-local
    restart: unless-stopped
    env_file:
      - mcp-server/.env
    environment:
      APP_ENV: development
      OLLAMA_HOST: http://host.docker.internal:11434
      POSTGRES_URL: postgresql://triage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in mcp-server/.env}@postgres:5432/tickets
      QDRANT_HOST: http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: support-triage-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in mcp-server/.env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d tickets -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: support-triage-qdrant-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -qi \"all shards are ready\" <&3' "]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  qdrant_data:
